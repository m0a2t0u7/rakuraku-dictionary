name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::Secret KEYSTORE_BASE64 が未登録のため、確認用ビルドのみ行います"; echo "SIGNED=0" >> $GITHUB_ENV; exit 0; fi
          echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGNED=1" >> $GITHUB_ENV
      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: rakuraku
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          T=assembleDebug; if [ "$SIGNED" = "1" ]; then T=assembleRelease; else unset KEYSTORE_PATH; fi
          set +e
          gradle :app:$T --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "error:|What went wrong|\.java:[0-9]+|Exception|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Rename
        id: v
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "ver=$VER" >> $GITHUB_OUTPUT
          if [ "$SIGNED" = "1" ]; then cp app/build/outputs/apk/release/app-release.apk rakuraku-dictionary-$VER.apk
          else cp app/build/outputs/apk/debug/app-debug.apk rakuraku-dictionary-$VER-test.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: rakuraku-dictionary-${{ steps.v.outputs.ver }}
          path: rakuraku-dictionary-*.apk
      - name: Release (署名済みのときだけ)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v${{ steps.v.outputs.ver }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rakuraku-dictionary-*.apk --clobber
          else
            gh release create "$TAG" rakuraku-dictionary-*.apk --title "らくらく辞書 $TAG" --notes "自動ビルド。APKをダウンロードしてインストールしてください。"
          fi
