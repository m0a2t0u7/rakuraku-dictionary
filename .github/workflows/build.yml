name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret KEYSTORE_BASE64 が未登録です"; exit 1; fi
          echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: rakuraku
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        id: v
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "ver=$VER" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/release/app-release.apk rakuraku-dictionary-$VER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rakuraku-dictionary-${{ steps.v.outputs.ver }}
          path: rakuraku-dictionary-*.apk
      - name: Release (versionNameが新しいときだけ)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v${{ steps.v.outputs.ver }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rakuraku-dictionary-*.apk --clobber
          else
            gh release create "$TAG" rakuraku-dictionary-*.apk --title "らくらく辞書 $TAG" --notes "自動ビルド。APKをダウンロードしてインストールしてください。"
          fi
